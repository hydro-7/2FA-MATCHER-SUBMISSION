<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/booking-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Travel Together</title>
      <script>
      // Apply the saved theme before first paint to avoid a light flash.
      try {
        const saved = JSON.parse(localStorage.getItem("travel-matcher-theme"));
        if (saved?.state?.theme) document.documentElement.dataset.theme = saved.state.theme;
      } catch {}
    </script>
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
